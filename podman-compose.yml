services:
  mysql:
    image: docker.io/library/mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${mysql_password}
      MYSQL_DATABASE: bankmangement
    volumes:
    - ./mysqldata:/var/lib/mysql
  app:
    build: .
    image: localhost/samplepod:latest
    ports:
    - "8080:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bankmangement
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${mysql_password}
    depends-on:
    - mysql
  redis:
    image: docker.io/library/redis:7
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf/", "--reqirepass", "${REDIS_PASSWORD}" ]
    ports:
    - "6379:6379"
    volumes:
    - ./redis.conf:/usr/local/etc/redis/redis.conf:ro,Z
    - ./redisdata:/data
  vertica:
    image: docker.io/jbfavre/vertica
    container_name: vertica
    ports:
    - 5433:5433
    environment:
      vertica_password: ${vertica_pwd}
      vertica_db: vertica_db
    volumes:
    - ./verticadata:/var/lib/vertica

volumes:
  mysqldata:
  redisdata:
  verticadata:
