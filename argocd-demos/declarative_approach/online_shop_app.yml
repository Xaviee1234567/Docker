apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-shop-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL:  https://github.com/Xaviee1234567/Docker.git   # Replace it with your forked repo
    targetRevision: master
    path: argocd-demos/declarative_approach/online_shop
  destination:
    server: https://172.20.207.57:33893   # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    
